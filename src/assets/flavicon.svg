<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" fill="none">
    <style>
    path,
    circle,
    g {
      stroke: #af3131;
      }

    @media (prefers-color-scheme: dark) {
      path,
      circle,
      g {
        stroke: #ffffff;
      }
    }
  </style>
  <!-- Border circle -->
  <circle cx="60" cy="60" r="54" stroke="#af3131" stroke-width="4" fill="none"/>

  <!-- Fork (bigger + thicker) -->
  <g stroke="#af3131" stroke-width="5" stroke-linecap="round">
    <!-- prongs -->
    <line x1="46" y1="26" x2="46" y2="54"/>
    <line x1="56" y1="26" x2="56" y2="54"/>
    <line x1="66" y1="26" x2="66" y2="54"/>
    <!-- neck -->
    <line x1="56" y1="54" x2="56" y2="84"/>
  </g>

  <!-- Bigger "F" -->
  <g stroke="#af3131" stroke-width="4" stroke-linecap="round">
    <line x1="70" y1="42" x2="88" y2="42"/>
    <line x1="70" y1="56" x2="84" y2="56"/>
  </g>
</svg>