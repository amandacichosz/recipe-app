
<button class="back-button" routerLink="/recipes" mat-stroked-button>
  <span class="arrow">&#8592; </span>
  <span>Back</span>
</button>

@if (recipe$ | async; as recipe) {
  <div class="recipe-card">
    <div class="recipe-card--border-title">RECIPE</div>
    <div class="recipe-card--border">
      <div class="recipe-card__title">
        <div class="recipe-card__title-copy">
          <h2>{{ recipe.name | titlecase}}</h2>
        </div>

        <button class="recipe-card__menu app-icon-button" [matMenuTriggerFor]="recipeMenu" aria-label="Recipe options">
          <mat-icon>more_horiz</mat-icon>
        </button>
        <mat-menu #recipeMenu="matMenu">
          @for (item of menu; track item) {
            <button mat-menu-item (click)="item.action()">
              <mat-icon>{{ item.icon }}</mat-icon>
              <span>{{ item.label }}</span>
            </button>
          }
        </mat-menu>
      </div>
      <div class="recipe-card__ingredients alt-text">
        <h3>Ingredients</h3>
        <ul>
          @for (ingredient of recipe.ingredients; track ingredient) {
            <li [innerHTML]="ingredient | slashWrap"></li>
          }
        </ul>
      </div>
      <div class="recipe-card__directions alt-text">
        <h3>Directions</h3>
        <ol>
          @for (direction of recipe.directions; track direction) {
            <li [innerHTML]="direction | slashWrap"></li>
          }
        </ol>
      </div>
    </div>
  </div>
} @else {
  <app-spinner></app-spinner>
}
