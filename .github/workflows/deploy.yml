name: Build and Deploy Angular App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install Yarn 1.22.22
        run: npm install -g yarn@1.22.22

      - name: Verify Yarn
        run: |
          node --version
          yarn --version

      - name: Install dependencies
        run: yarn install --frozen-lockfile --production=false
        env:
          NODE_ENV: development

      - name: Verify Angular CLI
        run: |
          echo "Angular CLI package:"
          yarn list --pattern @angular/cli

          echo "Angular CLI executable:"
          ls -la node_modules/.bin/ng

          echo "Angular CLI version:"
          ./node_modules/.bin/ng version

      - name: Build Angular app
        run: ./node_modules/.bin/ng build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RECIPE_APP_61A0E }}
          projectId: recipe-app-61a0e
          channelId: live
